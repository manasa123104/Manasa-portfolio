<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starred dashboards</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="grafana-app">
    <div class="grafana-shell">
        <aside id="side" class="grafana-side" aria-label="Main menu"></aside>
        <div class="grafana-main">
            <header class="grafana-top">
                <button class="grafana-mark" id="menu-toggle" type="button" aria-label="Open menu"></button>
                <button class="icon-button" id="menu-toggle-2" type="button" aria-label="Toggle navigation"><i class="fas fa-bars"></i></button>
                <span class="crumb" id="crumb">Starred</span>
                <button class="icon-button" id="focus-search" type="button" aria-label="Search"><i class="fas fa-magnifying-glass"></i></button>
                <div class="plus-wrap">
                    <button class="icon-button" id="plus-button" type="button" aria-label="Create" aria-expanded="false"><i class="fas fa-plus"></i></button>
                    <div id="plus-menu" class="popover" hidden>
                        <div class="menu-label">Dashboards</div>
                        <button class="menu-item" type="button" data-create="new"><i class="fas fa-plus"></i> New dashboard</button>
                        <button class="menu-item" type="button" data-create="import"><i class="fas fa-download"></i> Import dashboard</button>
                        <button class="menu-item" type="button" data-create="template"><i class="fas fa-table-cells"></i> Use template</button>
                    </div>
                </div>
                <button class="icon-button" id="help-button" type="button" aria-label="Help"><i class="fas fa-circle-question"></i></button>
                <button class="signin-link" id="signin-button" type="button">Sign in</button>
            </header>
            <div class="grafana-content" id="content"></div>
        </div>
    </div>
    <dialog id="app-dialog" class="dialog-card"></dialog>
    <script>
        const NAV = [
            ['starred', 'Starred', 'fa-star'],
            ['dashboards', 'Dashboards', 'fa-table-cells'],
            ['pages', 'Pages', 'fa-file'],
            ['explore', 'Explore', 'fa-compass'],
            ['drilldown', 'Drilldown', 'fa-arrow-down-short-wide'],
            ['ai', 'AI', 'fa-wand-magic-sparkles'],
            ['alerts', 'Alerts & IRM', 'fa-bell'],
            ['ml', 'Machine learning', 'fa-brain'],
            ['testing', 'Testing & synthetics', 'fa-vial'],
            ['observability', 'Observability', 'fa-chart-line'],
            ['connections', 'Connections', 'fa-plug'],
            ['fleet', 'Fleet Management', 'fa-server'],
            ['apps', 'More apps', 'fa-grip'],
            ['admin', 'Administration', 'fa-gear']
        ];
        const SORTS = [
            ['alpha-asc', 'Alphabetically (A-Z)'],
            ['alpha-desc', 'Alphabetically (Z-A)'],
            ['views-desc', 'Views total (most)'],
            ['views-asc', 'Views total (least)'],
            ['views30-desc', 'Views 30 days (most)'],
            ['views30-asc', 'Views 30 days (least)'],
            ['errors-desc', 'Errors total (most)'],
            ['errors-asc', 'Errors total (least)'],
            ['errors30-desc', 'Errors 30 days (most)'],
            ['errors30-asc', 'Errors 30 days (least)']
        ];
        const SEED = [
            { id: 'analytics-overview', name: 'Analytics Overview', folder: 'Analytics', tags: ['analytics', 'kpi'], owner: 'Manasa', starred: true, views: 1280, views30: 240, errors: 4, errors30: 1, panels: [['Active models', '12'], ['Data freshness', '4 min'], ['Requests', [40, 55, 48, 70, 90, 84, 110]], ['Error rate', [2.1, 1.4, 1.8, 1.1, 0.8, 0.9, 0.6]]] },
            { id: 'geoweaver', name: 'GeoWeaver Earth AI', folder: 'Research', tags: ['geospatial', 'nasa'], owner: 'Team', starred: false, views: 860, views30: 120, errors: 2, errors30: 0, panels: [['Workflows', '28'], ['NASA reports', '6'], ['Pipeline runs', [12, 15, 14, 20, 18, 24, 26]], ['Scenes processed', [30, 44, 38, 60, 55, 70, 66]]] },
            { id: 'giggso-ml', name: 'Giggso Model Operations', folder: 'Machine Learning', tags: ['mlops', 'ai'], owner: 'Manasa', starred: true, views: 640, views30: 210, errors: 6, errors30: 2, panels: [['Models shipped', '7'], ['Inference p95', '180 ms'], ['Predictions', [120, 150, 140, 180, 210, 200, 250]], ['Drift score', [0.2, 0.16, 0.22, 0.14, 0.1, 0.12, 0.08]]] },
            { id: 'model-quality', name: 'Model Quality', folder: 'Machine Learning', tags: ['ml', 'quality'], owner: 'Manasa', starred: false, views: 430, views30: 80, errors: 1, errors30: 0, panels: [['F1 score', '0.91'], ['Precision', '0.94'], ['F1 over time', [0.72, 0.78, 0.82, 0.86, 0.89, 0.9, 0.91]]] },
            { id: 'pipeline-health', name: 'Data Pipeline Health', folder: 'Analytics', tags: ['pipelines'], owner: 'Team', starred: false, views: 990, views30: 300, errors: 9, errors30: 3, panels: [['Jobs succeeding', '98%'], ['Failed today', '3'], ['Rows ingested', [80, 100, 90, 130, 150, 140, 180]]] }
        ];
        const KEY = 'portfolio-grafana-browser-v1';
        const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
        let boards = saved?.boards || SEED;
        let deleted = saved?.deleted || [];
        let banner = saved?.banner !== false;
        let section = 'starred';
        let query = '';
        let tag = '';
        let owner = '';
        let includePanels = false;
        let starredOnly = true;
        let createdByMe = false;
        let sort = 'alpha-asc';
        let grouped = false;
        let openId = null;
        let showDeleted = false;

        function persist() {
            localStorage.setItem(KEY, JSON.stringify({ boards, deleted, banner }));
        }

        function owners() {
            return [...new Set(boards.map((board) => board.owner))];
        }
        function tags() {
            return [...new Set(boards.flatMap((board) => board.tags))];
        }

        function visible() {
            const needle = query.trim().toLowerCase();
            return boards.filter((board) => {
                if (starredOnly && !board.starred) return false;
                if (tag && !board.tags.includes(tag)) return false;
                if (owner && board.owner !== owner) return false;
                if (createdByMe && board.owner !== 'Manasa') return false;
                if (!needle) return true;
                const panels = includePanels ? board.panels.map((panel) => panel[0]).join(' ') : '';
                return `${board.name} ${board.folder} ${board.tags.join(' ')} ${panels}`.toLowerCase().includes(needle);
            }).sort((a, b) => {
                const pair = {
                    'alpha-asc': [a.name, b.name],
                    'alpha-desc': [b.name, a.name],
                    'views-desc': [b.views, a.views],
                    'views-asc': [a.views, b.views],
                    'views30-desc': [b.views30, a.views30],
                    'views30-asc': [a.views30, b.views30],
                    'errors-desc': [b.errors, a.errors],
                    'errors-asc': [a.errors, b.errors],
                    'errors30-desc': [b.errors30, a.errors30],
                    'errors30-asc': [a.errors30, b.errors30]
                }[sort];
                if (typeof pair[0] === 'string') return pair[0].localeCompare(pair[1]);
                return pair[0] - pair[1];
            });
        }

        function renderSide() {
            document.getElementById('side').innerHTML = NAV.map(([id, label, icon]) => `
                <button class="nav-item ${id === section ? 'is-active' : ''}" type="button" data-section="${id}">
                    <i class="fas ${icon}"></i> ${label}
                    ${id === 'pages' ? '<span class="nav-badge">New!</span>' : ''}
                </button>`).join('') + '<a href="index.html"><i class="fas fa-house"></i> Portfolio</a>';
        }

        function emptyArt() {
            return `<svg class="empty-art" viewBox="0 0 220 160" aria-hidden="true">
                <ellipse cx="110" cy="130" rx="70" ry="16" fill="#2a2150"/>
                <circle cx="78" cy="78" r="28" fill="#ffb357"/>
                <circle cx="70" cy="72" r="4" fill="#1f2937"/>
                <circle cx="90" cy="72" r="4" fill="#1f2937"/>
                <path d="M70 90c6 6 16 6 24 0" stroke="#1f2937" stroke-width="3" fill="none"/>
                <circle cx="132" cy="78" r="22" fill="none" stroke="#8e8ea8" stroke-width="6"/>
                <path d="M148 94 l18 18" stroke="#8e8ea8" stroke-width="6" stroke-linecap="round"/>
                <rect x="150" y="40" width="36" height="28" rx="4" fill="#3d71d9"/>
                <path d="M156 60 l8-10 6 6 8-12" stroke="white" stroke-width="2" fill="none"/>
            </svg>`;
        }

        function drawChart(canvas, values) {
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = Math.max(1, rect.width) * dpr;
            canvas.height = Math.max(1, rect.height) * dpr;
            const ctx = canvas.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            const width = rect.width;
            const height = rect.height;
            const min = Math.min(...values);
            const max = Math.max(...values);
            const span = max - min || 1;
            ctx.strokeStyle = '#5794f2';
            ctx.lineWidth = 2;
            ctx.beginPath();
            values.forEach((value, index) => {
                const x = 8 + (index / (values.length - 1 || 1)) * (width - 16);
                const y = height - 8 - ((value - min) / span) * (height - 16);
                if (index === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.stroke();
        }

        function renderBoard(board) {
            document.getElementById('content').innerHTML = `
                <div class="page-heading">
                    <button class="quiet-button" type="button" id="close-board">All dashboards</button>
                    <h1>${board.name}</h1>
                    <button class="icon-button" id="board-star" type="button" aria-label="Star">${board.starred ? '★' : '☆'}</button>
                </div>
                <div class="panel-grid">
                    ${board.panels.map((panel, index) => Array.isArray(panel[1])
                        ? `<article class="panel panel-chart"><h2>${panel[0]}</h2><canvas data-chart="${index}"></canvas></article>`
                        : `<article class="panel"><h2>${panel[0]}</h2><div class="panel-value">${panel[1]}</div></article>`).join('')}
                </div>`;
            requestAnimationFrame(() => {
                board.panels.forEach((panel, index) => {
                    if (!Array.isArray(panel[1])) return;
                    const canvas = document.querySelector(`[data-chart="${index}"]`);
                    if (canvas) drawChart(canvas, panel[1]);
                });
            });
            document.getElementById('close-board').onclick = () => { openId = null; render(); };
            document.getElementById('board-star').onclick = () => {
                board.starred = !board.starred;
                persist();
                render();
            };
        }

        function renderList() {
            const rows = visible();
            const deletedBlock = showDeleted ? `<div class="board-list" style="margin-bottom:1rem">${deleted.length ? deleted.map((board) => `
                <div class="board-row"><span></span><span>${board.name}</span><span class="meta">Deleted</span>
                <button class="quiet-button" type="button" data-restore="${board.id}">Restore</button></div>`).join('') : '<p class="meta">Nothing was deleted.</p>'}</div>` : '';
            const list = rows.length ? (grouped
                ? [...new Set(rows.map((board) => board.folder))].map((folder) => `
                    <h2 style="margin:0.8rem 0 0.4rem;color:#fff;font-size:1rem">${folder}</h2>
                    <div class="board-list">${rowHtml(rows.filter((board) => board.folder === folder))}</div>`).join('')
                : `<div class="board-list">${rowHtml(rows)}</div>`)
                : `<div class="empty-state">${emptyArt()}<p>No dashboards match these filters.</p></div>`;
            document.getElementById('content').innerHTML = `
                ${banner ? `<section class="promo"><div><h2>Your data deserves a clearer view</h2><p>Metrics from analytics, research, and machine learning, gathered on boards you can star, sort, and open.</p><button class="account-button" type="button" id="banner-account">Create free account</button></div><button class="promo-close" type="button" id="banner-close" aria-label="Dismiss">×</button></section>` : ''}
                <div class="page-heading"><h1>${section === 'starred' ? 'Starred' : 'Dashboards'}</h1><button class="quiet-button" type="button" id="deleted-button">Recently deleted</button></div>
                ${deletedBlock}
                <div class="search-line"><input id="search" type="search" placeholder="Search for dashboards and folders" value="${query.replace(/"/g, '&quot;')}"></div>
                <div class="filter-line">
                    <select id="tag-filter" class="select-button"><option value="">Filter by tag</option>${tags().map((item) => `<option ${item === tag ? 'selected' : ''}>${item}</option>`).join('')}</select>
                    <select id="owner-filter" class="select-button"><option value="">Filter by owner</option>${owners().map((item) => `<option ${item === owner ? 'selected' : ''}>${item}</option>`).join('')}</select>
                    <label class="check-button"><input id="panels-check" type="checkbox" ${includePanels ? 'checked' : ''}> Include panels</label>
                    <label class="check-button"><input id="starred-check" type="checkbox" ${starredOnly ? 'checked' : ''}> Starred</label>
                </div>
                <div class="view-line">
                    <label class="check-button"><input id="mine-check" type="checkbox" ${createdByMe ? 'checked' : ''}> Created by me</label>
                    <button class="icon-button" id="group-toggle" type="button" aria-label="Toggle folders"><i class="fas ${grouped ? 'fa-list' : 'fa-folder'}"></i></button>
                    <div class="sort-wrap">
                        <button class="select-button" id="sort-button" type="button" aria-expanded="false">Sort</button>
                        <div id="sort-menu" class="popover" hidden>
                            ${SORTS.map(([id, label]) => `<button class="menu-item ${id === sort ? 'is-selected' : ''}" type="button" data-sort="${id}">${label}</button>`).join('')}
                        </div>
                    </div>
                </div>
                ${list}`;
            bindList();
        }

        function rowHtml(rows) {
            return rows.map((board) => `
                <div class="board-row">
                    <button class="icon-button" type="button" data-star="${board.id}" aria-label="Star ${board.name}" style="color:${board.starred ? '#ff9830' : '#6e6e80'}">${board.starred ? '★' : '☆'}</button>
                    <button class="board-open" type="button" data-open="${board.id}">${board.name}</button>
                    <span class="meta">${board.folder}</span>
                    <span class="meta">${board.tags.join(' · ')} · ${board.views} views</span>
                    <button class="icon-button" type="button" data-delete="${board.id}" aria-label="Delete ${board.name}"><i class="fas fa-trash"></i></button>
                </div>`).join('');
        }

        function bindList() {
            const search = document.getElementById('search');
            if (search) search.addEventListener('input', (event) => { query = event.target.value; renderList(); document.getElementById('search').focus(); });
            document.getElementById('tag-filter').onchange = (event) => { tag = event.target.value; render(); };
            document.getElementById('owner-filter').onchange = (event) => { owner = event.target.value; render(); };
            document.getElementById('panels-check').onchange = (event) => { includePanels = event.target.checked; render(); };
            document.getElementById('starred-check').onchange = (event) => { starredOnly = event.target.checked; render(); };
            document.getElementById('mine-check').onchange = (event) => { createdByMe = event.target.checked; render(); };
            document.getElementById('group-toggle').onclick = () => { grouped = !grouped; render(); };
            document.getElementById('deleted-button').onclick = () => { showDeleted = !showDeleted; render(); };
            const sortButton = document.getElementById('sort-button');
            const sortMenu = document.getElementById('sort-menu');
            sortButton.onclick = (event) => {
                event.stopPropagation();
                sortMenu.hidden = !sortMenu.hidden;
                sortButton.setAttribute('aria-expanded', String(!sortMenu.hidden));
            };
            sortMenu.querySelectorAll('[data-sort]').forEach((button) => {
                button.onclick = () => { sort = button.dataset.sort; render(); };
            });
            document.getElementById('content').querySelectorAll('[data-star]').forEach((button) => {
                button.onclick = () => {
                    const board = boards.find((item) => item.id === button.dataset.star);
                    board.starred = !board.starred;
                    persist();
                    render();
                };
            });
            document.getElementById('content').querySelectorAll('[data-open]').forEach((button) => {
                button.onclick = () => { openId = button.dataset.open; render(); };
            });
            document.getElementById('content').querySelectorAll('[data-delete]').forEach((button) => {
                button.onclick = () => {
                    const index = boards.findIndex((item) => item.id === button.dataset.delete);
                    deleted.unshift(boards.splice(index, 1)[0]);
                    showDeleted = true;
                    persist();
                    render();
                };
            });
            document.getElementById('content').querySelectorAll('[data-restore]').forEach((button) => {
                button.onclick = () => {
                    const index = deleted.findIndex((item) => item.id === button.dataset.restore);
                    boards.push(deleted.splice(index, 1)[0]);
                    persist();
                    render();
                };
            });
            const close = document.getElementById('banner-close');
            if (close) close.onclick = () => { banner = false; persist(); render(); };
            const account = document.getElementById('banner-account');
            if (account) account.onclick = openSignIn;
        }

        function renderSectionNote() {
            const labels = Object.fromEntries(NAV);
            document.getElementById('content').innerHTML = `<div class="page-heading"><h1>${labels[section]}</h1></div><p class="section-note">This section is part of the dashboard browser layout. Starred and Dashboards are the working lists.</p>`;
        }

        function render() {
            document.getElementById('crumb').textContent = section === 'dashboards' ? 'Dashboards' : (Object.fromEntries(NAV)[section] || 'Starred');
            renderSide();
            if (openId) {
                const board = boards.find((item) => item.id === openId);
                if (board) { renderBoard(board); return; }
                openId = null;
            }
            if (section === 'starred' || section === 'dashboards') renderList();
            else renderSectionNote();
        }

        function addBoard(name, folder) {
            boards.unshift({
                id: `board-${Date.now()}`,
                name,
                folder,
                tags: ['custom'],
                owner: 'Manasa',
                starred: true,
                views: 0,
                views30: 0,
                errors: 0,
                errors30: 0,
                panels: [['Status', 'New'], ['Signals', [1, 2, 3, 4, 5, 4, 6]]]
            });
            section = 'dashboards';
            starredOnly = false;
            persist();
            render();
        }

        function openDialog(title, body) {
            const dialog = document.getElementById('app-dialog');
            dialog.innerHTML = `<h2>${title}</h2>${body}<div class="dialog-actions"><button class="quiet-button" type="button" id="dialog-cancel">Close</button></div>`;
            dialog.showModal();
            document.getElementById('dialog-cancel').onclick = () => dialog.close();
        }

        function openSignIn() {
            openDialog('Sign in', '<p>This browser is a portfolio demo. There is no account to create, and nothing is sent to Grafana.</p>');
        }

        function openCreate(kind) {
            const dialog = document.getElementById('app-dialog');
            const heading = kind === 'import' ? 'Import dashboard' : kind === 'template' ? 'Use template' : 'New dashboard';
            dialog.innerHTML = `<h2>${heading}</h2><input id="new-name" value="${kind === 'template' ? 'Analytics starter' : ''}" placeholder="Dashboard name"><div class="dialog-actions"><button class="quiet-button" type="button" id="dialog-cancel">Cancel</button><button class="account-button" type="button" id="dialog-save">Create</button></div>`;
            dialog.showModal();
            document.getElementById('dialog-cancel').onclick = () => dialog.close();
            document.getElementById('dialog-save').onclick = () => {
                const name = document.getElementById('new-name').value.trim();
                if (!name) return;
                addBoard(name, kind === 'template' ? 'Templates' : 'General');
                dialog.close();
            };
        }

        document.getElementById('side').addEventListener('click', (event) => {
            const button = event.target.closest('[data-section]');
            if (!button) return;
            section = button.dataset.section;
            openId = null;
            showDeleted = false;
            if (section === 'starred') starredOnly = true;
            if (section === 'dashboards') starredOnly = false;
            document.getElementById('side').classList.remove('is-open');
            render();
        });

        function toggleSide() {
            const side = document.getElementById('side');
            if (window.innerWidth <= 800) side.classList.toggle('is-open');
            else side.classList.toggle('is-collapsed');
        }
        document.getElementById('menu-toggle').onclick = toggleSide;
        document.getElementById('menu-toggle-2').onclick = toggleSide;
        document.getElementById('focus-search').onclick = () => document.getElementById('search')?.focus();
        document.getElementById('plus-button').onclick = (event) => {
            event.stopPropagation();
            const menu = document.getElementById('plus-menu');
            menu.hidden = !menu.hidden;
        };
        document.getElementById('plus-menu').querySelectorAll('[data-create]').forEach((button) => {
            button.onclick = () => {
                document.getElementById('plus-menu').hidden = true;
                openCreate(button.dataset.create);
            };
        });
        document.getElementById('help-button').onclick = () => openDialog('Help', '<p>Star a dashboard, filter the list, sort it, or open a board. Deleted boards can be restored from Recently deleted.</p>');
        document.getElementById('signin-button').onclick = openSignIn;
        document.addEventListener('click', (event) => {
            if (event.target.closest('.popover, #plus-button, #sort-button')) return;
            document.getElementById('plus-menu').hidden = true;
            const sortMenu = document.getElementById('sort-menu');
            if (sortMenu) sortMenu.hidden = true;
        });
        const sideStyle = document.createElement('style');
        sideStyle.textContent = '.grafana-side.is-collapsed{display:none}';
        document.head.appendChild(sideStyle);
        render();
    </script>
</body>
</html>
